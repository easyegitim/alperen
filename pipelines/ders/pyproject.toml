[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogrenmen-ders"
version = "0.1.0"
description = "Öğrenmen ders videosu analizi (M08): kayıt, ses/kare çıkarımı, isimsiz transkript, güçlü model analizi, video silme"
readme = "README.md"
requires-python = ">=3.11"
# Yerel yol bağımlılıkları (ogrenmen-common, ogrenmen-contracts, ogrenmen-pii) BLUEPRINT §2 gereği aynı ortamda
# `pip install -e <yol>` ile önceden kurulmuş olmalıdır (pipelines/common README'si). Dış Python bağımlılığı yoktur:
# ses ve kare çıkarımı sistemdeki ffmpeg/ffprobe ikilileriyle (subprocess) yapılır.
dependencies = [
  "ogrenmen-common==0.1.0",
  "ogrenmen-contracts==0.1.0",
  "ogrenmen-pii==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
ogrenmen-ders = "ogrenmen_ders.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ogrenmen_ders = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ogrenmen_ders"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogrenmen-kitap"
version = "0.1.0"
description = "Öğrenmen Kitap (M10): araştırma ajanı — sorgu genişletme, OpenAlex/Semantic Scholar/arXiv araması, Crossref doğrulaması, Unpaywall PDF'leri, kaynaklı sentez, BibTeX/APA"
readme = "README.md"
requires-python = ">=3.11"
# Yerel yol bağımlılıkları (ogrenmen-common, ogrenmen-contracts, ogrenmen-pii) BLUEPRINT §2 gereği aynı ortamda
# `pip install -e <yol>` ile önceden kurulmuş olmalıdır (pipelines/common README'si). httpx ogrenmen-common'dan gelir.
# rapidfuzz: başlık benzerliği (token_set_ratio, §6.5 adım 4); pypdf: açık erişim PDF metni (adım 5);
# bibtexparser 2.1.0: üretilen BibTeX'in geçerlilik denetimi (adım 7; LLM değil, şablon). 1.4.x yalnız sdist'tir ve
# bu ortamda derlenemiyor; 2.x tekerlekli ve parse_string/failed_blocks ile kopya anahtarı ayrıca bildirir.
dependencies = [
  "bibtexparser==2.1.0",
  "httpx==0.28.1",
  "ogrenmen-common==0.1.0",
  "ogrenmen-contracts==0.1.0",
  "ogrenmen-pii==0.1.0",
  "pypdf==6.17.0",
  "rapidfuzz==3.14.6",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
ogrenmen-kitap = "ogrenmen_kitap.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ogrenmen_kitap = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = ["live: canlı Postgres gerektirir (OGRENMEN_DATABASE_URL yoksa atlanır)"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ogrenmen_kitap"]

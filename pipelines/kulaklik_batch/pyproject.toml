[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogrenmen-kulaklik"
version = "0.1.0"
description = "Öğrenmen Kulaklık toplu işleri (M07): gece olguları, haftalık özet, panel metrikleri ve pilot kapısı, işaretli cevap örneklemi, saklama, maliyet raporu, harcama denetimi, eksik embedding"
readme = "README.md"
requires-python = ">=3.11"
# Yerel yol bağımlılıkları (ogrenmen-common, ogrenmen-contracts, ogrenmen-pii) BLUEPRINT §2 gereği aynı ortamda
# `pip install -e <yol>` ile önceden kurulmuş olmalıdır (pipelines/common README'si). Dış bağımlılık yoktur:
# metrikler JsonlDb/PostgREST satırları üzerinde saf Python ile hesaplanır.
dependencies = [
  "ogrenmen-common==0.1.0",
  "ogrenmen-contracts==0.1.0",
  "ogrenmen-pii==0.1.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[project.scripts]
ogrenmen-kulaklik = "ogrenmen_kulaklik.cli:entrypoint"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ogrenmen_kulaklik = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["ogrenmen_kulaklik"]

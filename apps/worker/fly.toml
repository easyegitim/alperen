# Fly.io: bir uygulama, iki süreç grubu. Dağıtım (depo kökünden): fly deploy -c apps/worker/fly.toml --dockerfile apps/worker/Dockerfile
# Sırlar `fly secrets set` ile (DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ANTHROPIC_API_KEY, VAPID_*); dosyaya yazılmaz.
app = "ogrenmen-worker"
primary_region = "fra"
# Süren işlere kapanışta süre tanınır (SHUTDOWN_TIMEOUT_MS 30 sn). Kök düzeyde olmalı ([deploy] altında değil).
kill_signal = "SIGTERM"
kill_timeout = 45

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  HEALTH_HOST = "0.0.0.0"
  HEALTH_PORT = "8080"
  LOG_LEVEL = "info"
  STORAGE_BUCKET_DOCUMENTS = "documents"

[processes]
  worker = "node --import tsx src/index.ts --process=worker"
  pdf = "node --import tsx src/index.ts --process=pdf"

# Dışarıya açılan hizmet yok: yalnız Fly iç sağlık denetimi (internal_port) ve iç ağ.
[[services]]
  processes = ["worker"]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "get"
    path = "/healthz"

[[services]]
  processes = ["pdf"]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[services.http_checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "get"
    path = "/healthz"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-1x"
  memory = "512mb"

[[vm]]
  processes = ["pdf"]
  size = "shared-cpu-2x"
  memory = "2gb"

[deploy]
  strategy = "rolling"

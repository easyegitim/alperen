# Öğrenmen Telegram botu (M04). Varsayılan (yerel) ortamda AI bağlaması YOKTUR: `wrangler dev --local`
# Workers AI'yi simüle edemez ve Cloudflare oturumu ister. Gerçek bağlama yalnız `--env production`.
name = "ogrenmen-bot"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[triggers]
crons = ["*/15 * * * *", "5 * * * *", "0 6 * * *", "0 3 * * *"]

[vars]
PUBLIC_ENV = "local"
PROMPT_VERSION_CHAT = "socratic.v3"
ADAPTERS = "real"
DB = "supabase"
TELEGRAM_API_BASE = "https://api.telegram.org"
QUOTA_BYPASS_TELEGRAM_IDS = ""

[observability]
enabled = true

[env.production]
name = "ogrenmen-bot"

[env.production.vars]
PUBLIC_ENV = "production"
PROMPT_VERSION_CHAT = "socratic.v3"
ADAPTERS = "real"
DB = "supabase"
TELEGRAM_API_BASE = "https://api.telegram.org"
QUOTA_BYPASS_TELEGRAM_IDS = ""

[env.production.triggers]
crons = ["*/15 * * * *", "5 * * * *", "0 6 * * *", "0 3 * * *"]

[env.production.observability]
enabled = true

[env.production.ai]
binding = "AI"

# Yalnız `bun run dev:fake` (wrangler dev --local): sahte bağımlılıklı giriş, hesap ve anahtar gerekmez.
# Üretim yapılandırması ../../wrangler.toml'dur; bu dosya dağıtılmaz. Değerler bilerek sahtedir.
name = "ogrenmen-bot-dev"
main = "dev-worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
send_metrics = false

[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[triggers]
crons = ["*/15 * * * *", "5 * * * *", "0 6 * * *", "0 3 * * *"]

[vars]
PUBLIC_ENV = "local"
PROMPT_VERSION_CHAT = "socratic.v3"
ADAPTERS = "fake"
DB = "fake"
TELEGRAM_API_BASE = "http://localhost:8788"
QUOTA_BYPASS_TELEGRAM_IDS = ""
TELEGRAM_BOT_TOKEN = "yerel-sahte-token"
TELEGRAM_WEBHOOK_SECRET = "yerel-webhook-gizi"
WEBHOOK_SECRET_PATH = "yerel-gizli-yol"
ADMIN_CHAT_ID = "999000"
LOG_LEVEL = "info"

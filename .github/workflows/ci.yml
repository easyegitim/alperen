# Öğrenmen CI (M13L) — hesapsız: hiçbir adım gizli anahtar istemez.
#   quick:   sır taraması + actionlint + tüm modül kabul komutları,
#            ağır build adımları olmadan (make check-quick)
#   heavy:   M04 wrangler build ve M11 panel mock build + statik pakette
#            anahtar/CDN taraması (check-all.sh --only M04,M11, tam kip)
#   db-live: pgvector'lü Postgres hizmet konteyneriyle canlı db-test
#            + tablet live (make db-test)
# Eylemler commit SHA'sına sabitlenir (yorumda sürüm).
name: ci

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quick:
    name: kabul (make check-quick)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Sır taraması (gerçek görünümlü anahtar yok)
        run: bash scripts/secret-scan.sh

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/contracts/python/pyproject.toml
            packages/mastery-math/python/pyproject.toml
            packages/pii/py/pyproject.toml
            pipelines/common/pyproject.toml
            pipelines/tablet/pyproject.toml
            content/tyt-matematik/pyproject.toml

      - name: Sistem araçları (ffmpeg, psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg postgresql-client

      - name: Python araçları (sabit sürüm)
        run: >-
          python -m pip install
          ruff==0.17.3 pytest==9.2.0 sqlfluff==4.4.0 pglast==8.7
          yamllint==1.38.0 PyYAML==6.0.3 actionlint-py==1.7.12.25
          sympy==1.14.0 matplotlib==3.11.2 numpy==2.5.3
          httpx==0.28.1 jsonschema==4.26.0

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      - name: Kabul komutları (hızlı)
        run: make check-quick

      - name: Kabul komutları izlenen dosyaları değiştirmedi
        run: git diff --exit-code

  heavy:
    name: ağır build (M04 wrangler, M11 panel + anahtar taraması)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: M04 + M11 tam kip (build adımları dahil; giz yok)
        run: bash scripts/check-all.sh --only M04,M11

      - name: Build izlenen dosyaları değiştirmedi
        run: git diff --exit-code

  db-live:
    name: canlı veritabanı (make db-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OGRENMEN_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/contracts/python/pyproject.toml
            pipelines/common/pyproject.toml
            pipelines/tablet/pyproject.toml
            content/tyt-matematik/pyproject.toml

      - name: psql istemcisi
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Yerel Python paketleri (export-sql, seed-keys, tablet live)
        run: >-
          python -m pip install
          pytest==9.2.0 pglast==8.7
          sympy==1.14.0 matplotlib==3.11.2 numpy==2.5.3
          -e packages/contracts/python
          -e packages/mastery-math/python
          -e packages/pii/py
          -e "pipelines/common[dev]"
          -e "pipelines/tablet[dev]"

      - name: Canlı testler (db-test.sh + tablet live; atlanan test FAIL)
        run: make db-test

# Öğrenmen 2.0 CI — hesapsız: hiçbir adım gizli anahtar istemez.
#   quick:   sır taraması + actionlint + her modülün check.sh'i,
#            canlı servis ve ağır derleme olmadan (make check-quick)
#   heavy:   aynı denetimler ağır adımlarla (make check): next build, tasarım
#            sistemi önizleme derlemesi, apps/web Playwright E2E
#   live-db: pgvector'lü Postgres hizmet konteyneriyle veritabanına bağlı
#            modüller canlı kipte (make db-test; apps/worker pg-boss dahil)
#   docker:  iki imaj da derlenir (Dockerfile.local, apps/worker/Dockerfile) ve
#            yerel deneme yığını compose ile gerçekten açılır (sahte LLM).
#            Bu iş yokken imajlar yalnız kurucunun makinesinde denenmiş oluyordu.
# apps/worker PDF testleri ve apps/web E2E Chromium ister: Playwright 1.56.1
# (apps/web @playwright/test ve apps/worker playwright-core ile aynı sürüm).
# Araçlar: Node 22 (.nvmrc), bun 1.4, Python 3.13, ffmpeg, psql.
# Eylemler commit SHA'sına sabitlenir (yorumda sürüm).
name: ci

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CI: "true"
  # Chromium çalışma alanında tutulur; apps/worker findInstalledChromium() bu yolu okur.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers

jobs:
  quick:
    name: hızlı denetim (make check-quick)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Sır taraması (gerçek görünümlü anahtar yok)
        run: bash scripts/secret-scan.sh

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/contracts/python/pyproject.toml
            packages/mastery-math/python/pyproject.toml
            packages/pii/py/pyproject.toml
            pipelines/common/pyproject.toml
            pipelines/tablet/pyproject.toml
            pipelines/kalem/pyproject.toml
            pipelines/ders/pyproject.toml
            content/tyt-matematik/pyproject.toml

      - name: Sistem araçları (ffmpeg, psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg postgresql-client

      - name: Python araçları (sabit sürüm)
        run: >-
          python -m pip install
          ruff==0.17.3 pytest==9.2.0 sqlfluff==4.4.0 pglast==8.7
          yamllint==1.38.0 PyYAML==6.0.3 actionlint-py==1.7.12.25
          sympy==1.14.0 matplotlib==3.11.2 numpy==2.5.3
          httpx==0.28.1 jsonschema==4.26.0

      - name: Bun bağımlılıkları (kilit dosyasına göre)
        run: bun install --frozen-lockfile

      - name: Playwright Chromium (1.56.1; PDF ve E2E testleri)
        run: bunx playwright@1.56.1 install --with-deps chromium

      - name: actionlint
        run: actionlint .github/workflows/*.yml

      - name: Denetimler (hızlı)
        run: make check-quick

      - name: Denetimler izlenen dosyaları değiştirmedi
        run: git diff --exit-code

  heavy:
    name: ağır denetim (make check)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/contracts/python/pyproject.toml
            packages/mastery-math/python/pyproject.toml
            packages/pii/py/pyproject.toml
            pipelines/common/pyproject.toml
            pipelines/tablet/pyproject.toml
            pipelines/kalem/pyproject.toml
            pipelines/ders/pyproject.toml
            content/tyt-matematik/pyproject.toml

      - name: Sistem araçları (ffmpeg, psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg postgresql-client

      - name: Python araçları (sabit sürüm)
        run: >-
          python -m pip install
          ruff==0.17.3 pytest==9.2.0 sqlfluff==4.4.0 pglast==8.7
          yamllint==1.38.0 PyYAML==6.0.3 actionlint-py==1.7.12.25
          sympy==1.14.0 matplotlib==3.11.2 numpy==2.5.3
          httpx==0.28.1 jsonschema==4.26.0

      - name: Bun bağımlılıkları (kilit dosyasına göre)
        run: bun install --frozen-lockfile

      - name: Playwright Chromium (1.56.1; PDF ve E2E testleri)
        run: bunx playwright@1.56.1 install --with-deps chromium

      - name: "Denetimler (ağır adımlar dahil: next build, önizleme derlemesi)"
        run: make check

      # apps/web check.sh E2E'yi yalnız OGRENMEN_LIVE=1 ile koşar (canlı Postgres ister); E2E sahte Supabase kullanır,
      # bu yüzden burada doğrudan çalıştırılır.
      - name: "Playwright E2E (sahte Supabase; 3 kabuk x 390/1440 px)"
        run: bun run --cwd apps/web test:e2e

      - name: Denetimler izlenen dosyaları değiştirmedi
        run: git diff --exit-code

  live-db:
    name: canlı veritabanı (make db-test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      OGRENMEN_DATABASE_URL: >-
        postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # actions/setup-node v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      # oven-sh/setup-bun v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      # actions/setup-python v5.6.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            packages/contracts/python/pyproject.toml
            packages/mastery-math/python/pyproject.toml
            packages/pii/py/pyproject.toml
            pipelines/common/pyproject.toml
            pipelines/tablet/pyproject.toml
            pipelines/kalem/pyproject.toml
            pipelines/ders/pyproject.toml
            content/tyt-matematik/pyproject.toml

      - name: Sistem araçları (ffmpeg, psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg postgresql-client

      - name: Python araçları (sabit sürüm)
        run: >-
          python -m pip install
          ruff==0.17.3 pytest==9.2.0 sqlfluff==4.4.0 pglast==8.7
          sympy==1.14.0 matplotlib==3.11.2 numpy==2.5.3
          httpx==0.28.1 jsonschema==4.26.0

      - name: Bun bağımlılıkları (kilit dosyasına göre)
        run: bun install --frozen-lockfile

      - name: Playwright Chromium (1.56.1; PDF ve E2E testleri)
        run: bunx playwright@1.56.1 install --with-deps chromium

      - name: Canlı testler (atlanan canlı test FAIL sayılır)
        run: make db-test

  docker:
    name: Docker imajları (yerel deneme + worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Yerel deneme imajı (derleme sırasında müfredat dışa aktarımı da koşar)
        run: docker compose -f docker-compose.local.yml build app

      - name: Yerel deneme imajı araçları
        run: >-
          docker compose -f docker-compose.local.yml run --rm --no-deps -T app sh -c
          'node --version && bun --version && python3 --version
          && python3 -I -c "import sympy, matplotlib, numpy, pglast; from ogrenmen_contracts import errors"
          && ffmpeg -version | head -1 && test -s /app/.image-build-id'

      - name: Yerel deneme yığını açılıyor (compose; sahte LLM, anahtar gerekmez)
        run: |
          docker compose -f docker-compose.local.yml run -d --service-ports \
            -e OGRENMEN_LLM=fake --name ogrenmen-smoke app
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "web hazır (${i}. deneme)"; break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' ogrenmen-smoke)" != "true" ]; then
              echo "kapsayıcı durdu"; docker logs ogrenmen-smoke; exit 1
            fi
            sleep 5
          done
          curl -fsS http://127.0.0.1:3000/api/health
          curl -fsS -o /dev/null -w 'giriş sayfası %{http_code}\n' http://127.0.0.1:3000/giris
          docker exec ogrenmen-smoke test -s /data/dev/jwt-secret
          docker logs ogrenmen-smoke | tail -30

      - name: Yığın günlükleri (hata olursa)
        if: failure()
        run: |
          docker logs ogrenmen-smoke || true
          docker exec ogrenmen-smoke sh -c 'tail -n 60 /data/dev/logs/*.log' || true

      - name: Worker imajı (üretim)
        run: docker build -f apps/worker/Dockerfile -t ogrenmen-worker .

      - name: Worker imajı araçları
        run: >-
          docker run --rm ogrenmen-worker sh -c
          'node --version && python3 --version
          && python3 -I -c "import sympy, matplotlib, numpy; print(sympy.__version__, numpy.__version__, matplotlib.__version__)"
          && node --import tsx --input-type=module -e "await import(\"./src/jobs/registry.ts\"); console.log(\"iş kayıt defteri yüklendi\")"
          && pdftoppm -v 2>&1 | head -1 && ffmpeg -version | head -1 && id -un'

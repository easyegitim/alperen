[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogrenmen-contracts"
version = "0.1.0"
description = "Öğrenmen sözleşmeleri: JSON Schema (2020-12) doğrulayıcı, Gemini düzleştirme, models.json"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.18,<5", "referencing>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.setuptools]
packages = ["ogrenmen_contracts"]

[tool.setuptools.package-data]
# schemas ve models.json paket dizinindeki sembolik bağlardır (../../schemas, ../../models.json);
# tek kaynak packages/contracts/ altındaki dosyalardır.
ogrenmen_contracts = ["py.typed", "models.json", "schemas/*.json", "schemas/gemini/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

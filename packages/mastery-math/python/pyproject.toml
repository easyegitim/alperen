[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ogrenmen-mastery"
version = "0.1.0"
description = "Öğrenmen ustalık matematiği (BKT) — TS ve SQL ile aynı formüller"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1"]

[tool.setuptools]
packages = ["ogrenmen_mastery"]

[tool.setuptools.package-data]
ogrenmen_mastery = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>StatTile — önizleme</title><style>.og-stage{align-items:stretch}</style></head>
<body>
<div id="root" class="og-stage"></div>
<script>
  var O = window.Ogrenmen, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null,
    h(O.StatTile, { label: 'Cevapsız soru', value: '3', status: 'danger', statusText: 'Acil', hint: '1 tanesi 14 saattir' }),
    h(O.StatTile, { label: 'Sessiz öğrenci', value: '2', status: 'warning', statusText: 'Dikkat', hint: '3 günden uzun' }),
    h(O.StatTile, { label: 'Yaklaşan teslim', value: '5', hint: 'bu hafta' }),
    h(O.StatTile, { label: 'Ortalama yanıt süresi', value: '1,4', unit: 'saat', status: 'success', statusText: 'Hedefte', hint: 'hedef 2 saat' })
  ));
</script>
</body>
</html>

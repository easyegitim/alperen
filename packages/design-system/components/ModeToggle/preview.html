<!doctype html>
<html lang="tr">
<head><meta charset="utf-8"><title>ModeToggle — önizleme</title></head>
<body>
<div id="root" class="og-stage"></div>
<script>
  var O = window.Ogrenmen, h = React.createElement;
  function Demo() {
    var s = React.useState('socratic');
    return h(React.Fragment, null,
      h(O.ModeToggle, { value: s[0], onChange: s[1] }),
      h(O.ModeToggle, { value: 'direct', compact: true }));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));
</script>
</body>
</html>

<body>
<div id="root" class="og-stack"></div>
<script>
  var O = window.Ogrenmen, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, h('p', { className: 'q' }, '3/4 + 1/8 işleminin sonucu kaçtır?'), h(O.QuizOption, { letter: 'A' }, '4/12'), h(O.QuizOption, { letter: 'B', state: 'selected' }, '5/8'), h(O.QuizOption, { letter: 'C', state: 'correct', feedback: '6/8 + 1/8 = 7/8' }, '7/8'), h(O.QuizOption, { letter: 'D', state: 'incorrect', feedback: 'Paylar ve paydalar ayrı ayrı toplanmaz.' }, '4/12')));
